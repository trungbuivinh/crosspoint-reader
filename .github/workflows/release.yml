name: Compile Release
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Validate tag matches firmware version
        shell: bash
        run: |
          set -euo pipefail
          firmware_version="$(awk '
            /^\[crosspoint\][[:space:]]*$/ { in_section = 1; next }
            /^\[/ { in_section = 0 }
            in_section && /^[[:space:]]*version[[:space:]]*=/ {
              sub(/^[^=]*=[[:space:]]*/, "")
              sub(/[[:space:]]*$/, "")
              print
              exit
            }
          ' platformio.ini)"
          if [[ -z "${firmware_version}" ]]; then
            echo "Unable to read [crosspoint] version from platformio.ini" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "${firmware_version}" ]]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match firmware version '${firmware_version}'" >&2
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install build and formatting tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build wget
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y clang-format-21

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Audit fork invariants
        run: .claude/skills/crosspoint-upstream-release/scripts/audit_fork_invariants.sh "${GITHUB_REF_NAME}"

      - name: Run clang-format
        shell: bash
        run: |
          set -euo pipefail
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code

      - name: Run host unit tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test
          ctest --test-dir build/test --output-on-failure -j 2

      - name: Run cppcheck
        run: pio check --fail-on-defect low --fail-on-defect medium --fail-on-defect high

      - name: Build CrossPoint
        run: pio run -e gh_release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrossPoint-${{ github.ref_name }}
          path: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin

      - name: Create stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" .pio/build/gh_release/firmware.bin --clobber
            gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease=false
          else
            gh release create "${GITHUB_REF_NAME}" \
              .pio/build/gh_release/firmware.bin \
              --verify-tag \
              --title "CrossPoint Reader ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
